---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04']
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
        # Add a single Windows leg so the ExifTool-backed photomap / MP4
        # timed-metadata tests actually run on Windows (path, subprocess and
        # encoding handling differ). One Python version keeps CI cost down.
        include:
          - os: 'windows-latest'
            python-version: '3.12'
    defaults:
      run:
        # Git Bash ships on the Windows runners, so the bash-syntax steps
        # below (|| true, ls -la, multi-line) work on every OS.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra build --python ${{ matrix.python-version }}
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      # Dogfoods our own pinned, checksum-verified provisioning instead of
      # chocolatey (whose community feed outages kept breaking this leg);
      # the shared resolver (env -> provisioned -> PATH) finds the copy.
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: uv run dji-embed doctor --install exiftool
      - name: Pytest
        run: uv run pytest
      - name: Build package
        run: uv run python -m build

      - name: Smoke test - Version check
        run: |
          echo "Testing dji-embed --version"
          uv run dji-embed --version

      - name: Smoke test - Doctor command
        run: |
          echo "Testing dji-embed doctor (expect dependency warnings)"
          uv run dji-embed doctor || true

      - name: Smoke test - Check command with samples
        run: |
          echo "Testing dji-embed check with sample files"
          uv run dji-embed check examples/DJI_sample.SRT
          uv run dji-embed check samples/mini4pro/clip.SRT
          uv run dji-embed check samples/avata2/clip.SRT
          uv run dji-embed check samples/air3/clip.SRT

      - name: Smoke test - Convert command
        run: |
          echo "Testing dji-embed convert functionality"
          uv run dji-embed convert gpx examples/DJI_sample.SRT -o test_smoke.gpx
          uv run dji-embed convert csv examples/DJI_sample.SRT -o test_smoke.csv
          ls -la test_smoke.*

  # Browser-behaviour tests (Track B spec 2026-07-21): generated maps driven
  # in headless Chromium via pytest-playwright. One leg is enough — the
  # suite asserts the maps' inlined JS, which is OS-independent. Hermetic:
  # unpkg assets come from an SRI-verified download cache (kept warm below)
  # and tile requests are stubbed, so steady-state runs are offline.
  # This job is a REQUIRED check, so it must always report a status — a
  # GitHub-level `paths:` filter would leave it stuck "pending" and block
  # the merge. Instead the job itself inspects the PR diff and reports
  # green in seconds when nothing in it can affect the suite; the pattern
  # list below is deny-by-default (any unrecognised path runs the tests).
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the diff can affect this suite
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          run=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|gui/*|winget/*|mkdocs.yml|*.md|LICENSE|.gitignore|.github/ISSUE_TEMPLATE/*)
                ;;  # cannot affect the browser suite
              *)
                run=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "::notice::Browser suite skipped: the diff touches only" \
              "docs/GUI/manifest paths that cannot affect it."
          fi
      - name: Install uv
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        run: uv sync --extra dev --extra browser --python 3.12
      - name: Cache Chromium
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}
      - name: Cache map CDN assets
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/djiembed-test-assets
          key: map-assets-${{ hashFiles('src/dji_metadata_embedder/geo/photomap_html.py', 'src/dji_metadata_embedder/geo/flightmap_html.py') }}
      - name: Install Chromium
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        run: uv run playwright install chromium --with-deps
      # -n 2: rendering is CPU-bound in SwiftShader and the suite is
      # parallel-safe (ephemeral server ports, atomic asset-cache writes);
      # verified locally flake-free before enabling.
      - name: Browser tests
        if: github.event_name != 'pull_request' || steps.gate.outputs.run == 'true'
        run: uv run pytest tests/browser -n 2 -v

  # Desktop GUI (issue #264 stage 3): Avalonia app in gui/. Kept as its own
  # job so the Python matrix is untouched; ubuntu is enough for compile +
  # headless UI tests, Windows-specific packaging is exercised at release.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build gui/DjiEmbed.Gui.sln --configuration Release
      - name: Test (headless)
        run: >
          dotnet test gui/DjiEmbed.Gui.sln --configuration Release
          --no-build --verbosity normal
